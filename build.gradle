buildscript {
	repositories {
		mavenCentral()
	}
}

plugins {
	id 'com.github.ben-manes.versions' version '0.51.0'
}

allprojects {
	apply plugin: 'java-library'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	project.ext {
		javaVersion = JavaVersion.VERSION_17
	}

	if (!JavaVersion.current().isCompatibleWith(project.ext.javaVersion)) {
		throw new IllegalStateException("Must be built with Java ${project.ext.javaVersion} or higher (found: ${JavaVersion.current()})")
	}

}

subprojects {

	group = "smartthings"
	version = rootProject.file('version.txt').text.trim()

	apply plugin: "base"
	apply plugin: "groovy"
	apply plugin: "maven-publish"
	apply plugin: "jacoco"
	apply plugin: "idea"
	apply plugin: 'com.github.ben-manes.versions'
	apply from: rootProject.file('gradle/publishing.gradle')

	jacocoTestReport {
		reports {
			xml.required = true
		}
	}

	repositories {
		mavenCentral()
	}

}
