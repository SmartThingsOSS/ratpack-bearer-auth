apply plugin: "maven-publish"

java {
	withJavadocJar()
	withSourcesJar()
}

publishing {
	repositories {
		maven {
			credentials {
				username = smartThingsUserName
				password = smartThingsPassword
			}
			if (version.toString().contains('SNAPSHOT')) {
				url = "https://smartthings.jfrog.io/smartthings/libs-snapshot"
				println("Publishing " + version + " to libs-snapshot")
			} else {
				url = "https://smartthings.jfrog.io/smartthings/libs-release"
				println("Publishing " + version + " to libs-release")
			}
		}
	}

	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}