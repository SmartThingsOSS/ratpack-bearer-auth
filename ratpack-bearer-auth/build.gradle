dependencies {
  implementation platform("com.fasterxml.jackson:jackson-bom:$jacksonVersion")

  implementation "org.slf4j:slf4j-api:${slf4jVersion}"
  implementation "io.ratpack:ratpack-core:${ratpackVersion}"
  implementation "io.ratpack:ratpack-guice:${ratpackVersion}"
  runtimeOnly 'com.sun.activation:javax.activation:1.2.0'

  //Caching Impl
  implementation 'com.github.ben-manes.caffeine:caffeine:2.5.6'

  testImplementation "org.codehaus.groovy:groovy-all:${groovyVersion}"
  testImplementation 'com.github.tomakehurst:wiremock-standalone:2.20.0'
  testImplementation "io.ratpack:ratpack-groovy-test:${ratpackVersion}"
  testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
  testRuntimeOnly("net.bytebuddy:byte-buddy:1.18.11")
  testRuntimeOnly("org.objenesis:objenesis:3.5")
}

test{
  useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
  options.addStringOption('Xdoclint:none', '-quiet')
}
